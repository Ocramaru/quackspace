[project]
name = "quackspace"
dynamic = ["version"]
description = "A DuckDB-backed knowledge layer over your local work that helps LLMs navigate everything"
readme = "README.md"
authors = [
    { name = "Ocramaru" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "llm", "mcp", "rag", "knowledge-base", "search", "duckdb",
    "obsidian", "markdown", "notes", "retrieval", "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
    "Environment :: Console",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "duckdb>=1.5.3",
    "mcp[cli]>=1.27.2",
    "pyarrow>=24.0.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "rich-argparse>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/Ocramaru/quackspace"
Repository = "https://github.com/Ocramaru/quackspace"
Issues = "https://github.com/Ocramaru/quackspace/issues"

[project.scripts]
quack = "quack.cli:main"
quack-mcp = "quack.mcp_server:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/quack"]

[tool.pytest.ini_options]
# `perf` marks timing benchmarks; deselected by default (opt in with
# `pytest -m perf`) so the normal suite stays fast and non-flaky.
addopts = "-m 'not perf'"
testpaths = ["tests"]
markers = [
    "perf: timing benchmark, run with `pytest -m perf`",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
